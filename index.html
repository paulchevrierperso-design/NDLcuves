<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervision des Cuves NDL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 text-slate-100">

    <!-- MODAL DE CONNEXION -->
    <div id="login-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl max-w-md w-full text-center">
            <h2 class="text-2xl font-bold text-white mb-6">Accès Sécurisé</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <input type="text" id="login-username" required placeholder="Identifiant" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm">
                <input type="password" id="login-password" required placeholder="Mot de passe" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm">
                <div id="login-error" class="hidden text-rose-400 text-xs text-center bg-rose-950/50 p-2 rounded-lg">Identifiant incorrect.</div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl text-sm font-bold">Se Connecter</button>
            </form>
        </div>
    </div>

    <!-- HEADER -->
    <header class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row justify-between gap-4 border-b border-slate-800 pb-4">
        <div>
            <h1 class="text-2xl font-bold text-white">Gestion Cuves NDL</h1>
            <p class="text-sm text-slate-400">Supervision du Réseau</p>
        </div>
        <div class="flex gap-2">
            <button id="lock-btn" onclick="toggleLock()" class="px-4 py-2 bg-rose-600 rounded-xl text-sm font-bold">Verrouillé</button>
            <button onclick="logout()" class="px-4 py-2 bg-slate-800 rounded-xl text-sm">Déconnexion</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        <div id="view-schema" class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6">
            <div class="w-full mx-auto p-4 bg-slate-950/80 rounded-xl border border-slate-800/80">
                <div id="battery-left-list" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <script>
        // CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBQop-MWR8Xmmz1574RIHk8Nq9zbiDDYsc",
            authDomain: "gestion-cuves-ndl-7fc7c.firebaseapp.com",
            databaseURL: "https://gestion-cuves-ndl-7fc7c-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "gestion-cuves-ndl-7fc7c",
            storageBucket: "gestion-cuves-ndl-7fc7c.firebasestorage.app",
            messagingSenderId: "700168569124",
            appId: "1:700168569124:web:3f508f3B3155ab0ae373b1"
        };
        firebase.initializeApp(firebaseConfig);

        // AUTHENTIFICATION
        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById("login-username").value === "admin" && document.getElementById("login-password").value === "ndl2026") {
                localStorage.setItem("ndl_auth", "true");
                document.getElementById("login-modal").classList.add("hidden");
            } else {
                document.getElementById("login-error").classList.remove("hidden");
            }
        }

        function logout() { localStorage.removeItem("ndl_auth"); location.reload(); }

        // ÉTAT ET RENDU
        let isLocked = true;
        let tanks = [{ id: 60, pct: 50 }, { id: 61, pct: 25 }]; // Exemple

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-btn').innerText = isLocked ? "Verrouillé" : "Déverrouillé";
            renderSchema();
        }

        function setTankLevel(id, pct) {
            if (isLocked) return alert("Application verrouillée");
            tanks.find(t => t.id === id).pct = pct;
            renderSchema();
        }

        function renderSchema() {
            const list = document.getElementById('battery-left-list');
            list.innerHTML = tanks.map(t => `
                <div class="relative bg-slate-900 border border-slate-700 rounded-xl h-20 flex items-center justify-between p-4 overflow-hidden">
                    <span>Cuve ${t.id} - ${t.pct}%</span>
                    ${!isLocked ? `
                        <div class="flex gap-1 z-10">
                            ${[0,25,50,75,100].map(p => `<button onclick="setTankLevel(${t.id},${p})" class="px-2 py-1 bg-slate-700 hover:bg-blue-600 rounded text-xs">${p}%</button>`).join('')}
                        </div>` : ''}
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem("ndl_auth") !== "true") document.getElementById("login-modal").classList.remove("hidden");
            renderSchema();
        });
    </script>
</body>
</html>
